[project]
name = "home-credit-risk-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
    "xgboost-cpu==3.2.0",
    "lightgbm==4.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]
